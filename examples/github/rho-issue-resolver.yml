# Rho Issue Resolver
#
# Copy this file to .github/workflows/rho-issue-resolver.yml in your repository.
#
# It runs the Rho agent in two scenarios:
#   1. Automation mode  - when an issue is labeled `rho-agent`, Rho reads the
#      issue title + body and attempts to resolve it autonomously.
#   2. Interactive mode - when someone comments "@rho ..." on an issue or PR,
#      Rho replies conversationally to the request.
#
# The mode is auto-detected by `rho exec` from the GitHub event payload, so a
# single composite action handles both paths.
name: Rho Issue Resolver

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  rho:
    # Run on the `rho-agent` label, or on any comment mentioning @rho.
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'rho-agent') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@rho')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@rho'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Rho
        id: rho
        uses: GrayCodeAI/rho/.github/actions/rho@main
        with:
          # Leave prompt empty so Rho derives it from the triggering event.
          # Set a "/skill-name args" prompt here to dispatch a skill instead.
          prompt: ""
          auto: semi
          output-format: text
        env:
          # Provide your model provider credentials as repository secrets.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Post Rho response as a comment
        if: ${{ steps.rho.outputs.response != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const body = `🦅 **Rho**\n\n${{ toJSON(steps.rho.outputs.response) }}`;
            const issueNumber = context.issue.number;
            if (issueNumber) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }
