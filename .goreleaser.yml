# GoReleaser config for rho (the terminal AI coding agent).
# Derived from .shared-templates/.goreleaser.yml.tmpl; rho-specific deltas are
# commented inline. Run by .github/workflows/release.yml on a v* tag; see
# docs/RELEASING.md for the release process.
#
# Local validation (no publishing, no signing):
#   goreleaser check
#   goreleaser release --snapshot --clean --skip=publish,sign

version: 2
project_name: rho

# ---------------------------------------------------------------------------
# Pre-build hooks — verify module checksums before building anything.
# ---------------------------------------------------------------------------
before:
  hooks:
    - go mod verify

# ---------------------------------------------------------------------------
# Builds — linux/darwin/windows × amd64/arm64 (six targets).
# Reproducible: `mod_timestamp` ties the binary timestamp to the commit time
# rather than the build host's clock.
# ---------------------------------------------------------------------------
builds:
  - id: rho
    main: ./cmd/rho
    binary: rho
    env:
      - CGO_ENABLED=0
      # Build strictly from go.mod/go.sum, never from a developer go.work.
      - GOWORK=off
    flags:
      - -trimpath
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.ShortCommit}}
      - -X main.BuildDate={{.Date}}
    mod_timestamp: "{{ .CommitTimestamp }}"

# ---------------------------------------------------------------------------
# Archives — tar.gz on Unix, zip on Windows. Names are
# rho_<version>_<os>_<arch>.<ext>; install.sh and .github/actions/rho depend
# on this exact shape.
# ---------------------------------------------------------------------------
archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

# ---------------------------------------------------------------------------
# Source archive — published alongside binaries for downstream packagers.
# ---------------------------------------------------------------------------
source:
  enabled: true
  name_template: "{{ .ProjectName }}_{{ .Version }}_source"

# ---------------------------------------------------------------------------
# SBOMs — one SPDX document per archive, generated with syft. The release
# workflow installs syft before GoReleaser runs.
# ---------------------------------------------------------------------------
sboms:
  - artifacts: archive
    documents:
      - "${artifact}.spdx.sbom.json"

# ---------------------------------------------------------------------------
# Checksums — SHA-256 over every uploaded artifact, single file per release.
# ---------------------------------------------------------------------------
checksum:
  name_template: checksums.txt
  algorithm: sha256

# ---------------------------------------------------------------------------
# Signing — cosign keyless (Sigstore) signature over checksums.txt, using the
# release workflow's GitHub OIDC identity. The output is a self-contained
# Sigstore bundle (certificate + signature + transparency-log proof) that is
# uploaded with the release as checksums.txt.sigstore.json. Verify with:
#
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-identity "https://github.com/GrayCodeAI/rho/.github/workflows/release.yml@refs/tags/vX.Y.Z" \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     checksums.txt
# ---------------------------------------------------------------------------
signs:
  - id: cosign-checksum
    cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"

# ---------------------------------------------------------------------------
# Snapshot — unreleased dev builds get a clear synthetic version.
# ---------------------------------------------------------------------------
snapshot:
  version_template: "{{ incpatch .Version }}-next"

# ---------------------------------------------------------------------------
# Changelog — used for snapshots only. Tagged releases take their notes from
# the CHANGELOG.md section for the version (release.yml passes
# --release-notes), so the published notes match the curated changelog.
# ---------------------------------------------------------------------------
changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^chore:"
      - "^ci:"
      - "^test:"
      - "^style:"
      - "^build:"
      - "Merge pull request"
      - "Merge branch"
  groups:
    - title: "🚀 Features"
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "🐛 Bug Fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: "⚡ Performance"
      regexp: '^.*?perf(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: "♻️  Refactoring"
      regexp: '^.*?refactor(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: "📝 Documentation"
      regexp: '^.*?docs(\([[:word:]]+\))??!?:.+$'
      order: 4
    - title: "Other"
      order: 999

# Homebrew and npm are intentionally not configured: neither the
# GrayCodeAI/homebrew-tap repository nor the @graycodeai npm packages exist.
# See docs/RELEASING.md ("Distribution channels") before adding either.

# ---------------------------------------------------------------------------
# Release — GitHub release on this repository; rc/beta tags are marked as
# prereleases automatically.
# ---------------------------------------------------------------------------
release:
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
  header: |
    ## rho v{{ .Version }}

    Rho is the terminal AI coding agent from GrayCode (pre-1.0).
  footer: |

    ### Verify this release

    `checksums.txt` lists the SHA-256 of every asset and is signed with
    cosign keyless signing by this repository's release workflow:

    ```sh
    cosign verify-blob --bundle checksums.txt.sigstore.json \
      --certificate-identity "https://github.com/GrayCodeAI/rho/.github/workflows/release.yml@refs/tags/{{ .Tag }}" \
      --certificate-oidc-issuer https://token.actions.githubusercontent.com \
      checksums.txt
    sha256sum --ignore-missing -c checksums.txt
    ```

    {{ if .PreviousTag }}**Full changelog:** https://github.com/GrayCodeAI/rho/compare/{{ .PreviousTag }}...{{ .Tag }}{{ end }}
